<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Voice Power</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#6a5cff,#25c2a0);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
.card{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:94%;box-shadow:0 10px 30px #0004;text-align:center}
h1{margin:0 0 8px}button{font-size:1.1rem;padding:12px 18px;margin:6px;border:0;border-radius:12px;background:#6a5cff;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}button.ok{background:#1faa59}button.bad{background:#e0453a}button.alt{background:#eee;color:#222}
.big{font-size:2rem;margin:16px 0;min-height:2.4rem}.small{color:#666;font-size:.9rem}input{font-size:1.3rem;padding:10px;border-radius:10px;border:2px solid #ccc;width:80%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:70px;background:#6a5cff}.grid button.done{background:#1faa59}.grid button.hide{font-size:0}</style></head><body><div class=card><h1>🎤 Voice Power</h1><div id=lv></div><div class=small id=sc>Score: 0</div><div class=big id=w></div><div class=small id=ar></div><button onclick=say(cur[0])>🔊 Listen</button><button onclick=rec()>🎙️ Speak</button><button class=alt onclick=nx()>Skip ➡️</button><div id=msg class=small></div></div><script>function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}let LEV=0;function mkLevels(n,f){const e=document.getElementById('lv');e.innerHTML='';['Level 1','Level 2','Level 3'].forEach((t,k)=>{const b=document.createElement('button');b.textContent=t;b.className=k===LEV?'':'alt';b.onclick=()=>{LEV=k;mkLevels(n,f);f()};e.appendChild(b)})}function part(D){const n=Math.ceil(D.length/3);return D.slice(LEV*n,(LEV+1)*n)}const D=[["apple", "تفاحة"], ["book", "كتاب"], ["water", "ماء"], ["school", "مدرسة"], ["friend", "صديق"], ["family", "عائلة"], ["teacher", "مدرس"], ["house", "بيت"], ["happy", "سعيد"], ["big", "كبير"], ["banana", "موز"], ["homework", "واجب"], ["morning", "صباح"], ["sister", "أخت"], ["brother", "أخ"], ["breakfast", "فطار"], ["window", "شباك"], ["doctor", "طبيب"], ["market", "سوق"], ["yellow", "أصفر"], ["beautiful", "جميل"], ["library", "مكتبة"], ["yesterday", "امبارح"], ["vegetable", "خضار"], ["weather", "الطقس"], ["comfortable", "مريح"], ["important", "مهم"], ["different", "مختلف"], ["language", "لغة"], ["question", "سؤال"], ["restaurant", "مطعم"], ["hospital", "مستشفى"], ["temperature", "درجة الحرارة"], ["government", "حكومة"], ["environment", "بيئة"], ["necessary", "ضروري"], ["develop", "يطور"], ["knowledge", "معرفة"], ["thought", "فكرة"], ["through", "خلال"]];let cur,s=0;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function nx(){const p=part(D);cur=p[Math.floor(Math.random()*p.length)];w.textContent=cur[0];ar.textContent=cur[1];msg.textContent=''}function rec(){if(!SR){msg.textContent='Speech recognition needs Chrome or Edge.';return}const r=new SR();r.lang='en-US';r.onresult=e=>{const h=e.results[0][0].transcript.toLowerCase().trim();if(h===cur[0]){s+=10;sc.textContent='Score: '+s;msg.textContent='✅ Great! You said: '+h;setTimeout(nx,1200)}else msg.textContent='❌ I heard: '+h+'. Try again!'};r.onerror=()=>msg.textContent='Could not hear you. Try again.';r.start();msg.textContent='Listening...'}mkLevels(3,nx);nx();</script></body></html>
